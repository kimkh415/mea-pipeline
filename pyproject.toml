[project]
name = "mea-pipeline"
version = "1.2.0"
description = "MEA spike-train analysis pipeline (Python port of the Yang MATLAB pipeline)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24","scipy>=1.10","pandas>=2.0","pyarrow>=12","pyyaml>=6","h5py>=3.8",
                "matplotlib>=3.7"]

[project.scripts]
mea = "mea.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

